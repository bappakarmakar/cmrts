<!--header start-->

<section class="header">
	<div class="container">
		<div class="row">
			<div class="col-md-6">
				<img src="image/snehachaya-logo.png" class="img-responsive" alt="">
			</div>
			<div class="col-md-3 text-center">
				<div class="helpline"><img src="image/helpline.png" class="img-responsive" alt="">Helpline No:XXXXXXXXXX</div>
			</div>

<!--login start-->

<section class="login">
	<div class="login-img">
		<img src="image/login-img.png" class="img-responsive" alt="">
	</div>
	<div class="login-sec">
		<h2 class="login-sec-heading">Sneha Chaya Login</h2>
		<form>
			<div class="custom_select_box select_box_one">
				<select class="custom_login_select">
					<option>Please Select Stakeholders</option>
					<option>Stakeholders1</option>
					<option>Stakeholders2</option>
				</select>
			</div>
			<div class="password_box">
				<input type="text" class="custom_login_box" placeholder="Password">
			</div>

			<div class="login_btn_sec">
				<button class="button login_btn cancel_btn">Cancel</button>
				<button class="button login_btn">Login</button>
			</div>
		</form>
	</div>
	<div class="clearfix"></div>
</section>

<!--login end-->
